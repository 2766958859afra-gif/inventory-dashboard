<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>滤清备货库存看板 v14</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<style>
:root{--bg:#f5f6f8;--card-bg:#ffffff;--border:#e2e5ea;--text:#1a1d23;--text-muted:#6b7280;--accent:#2563eb;--accent-light:#eff6ff;--red:#b91c1c;--orange:#f59e0b;--green:#16a34a;--purple:#7c3aed;--shadow:0 1px 3px rgba(0,0,0,0.06);--radius:8px}
[data-theme="dark"]{--bg:#0f1119;--card-bg:#1a1d2e;--border:#2a2d3e;--text:#c9d1d9;--text-muted:#8b949e;--accent:#3b82f6;--accent-light:#1e293b;--red:#f87171;--orange:#f59e0b;--green:#3fb950;--purple:#a78bfa}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;background:var(--bg);color:var(--text);display:flex;height:100vh;overflow:hidden}
.sidebar{width:52px;min-width:52px;background:var(--card-bg);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:10;overflow-y:auto;overflow-x:hidden;transition:width .2s ease}
.sidebar:hover,.sidebar.pinned{width:200px;min-width:200px}
.sidebar-nav{flex:1;padding:4px;overflow:hidden;white-space:nowrap}
.nav-item{padding:10px 12px;cursor:pointer;border-radius:6px;margin-bottom:2px;color:var(--text-muted);font-size:13px;display:flex;align-items:center;gap:8px;transition:.15s;white-space:nowrap;overflow:hidden}
.nav-item:hover{background:var(--accent-light);color:var(--text)}.nav-item.active{background:var(--accent);color:#fff}
.nav-ico{font-size:15px;flex-shrink:0;width:24px;text-align:center}
.nav-txt{opacity:0;max-width:0;overflow:hidden;transition:max-width .2s ease,opacity .15s ease;display:inline-block}
.sidebar:hover .nav-txt,.sidebar.pinned .nav-txt{opacity:1;max-width:140px}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.page-header{padding:8px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-wrap:wrap;flex-shrink:0;background:var(--card-bg)}
.page-header h1{font-size:15px;font-weight:600}.date{color:var(--text-muted);font-size:11px}
.controls{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.filter-select{background:var(--card-bg);border:1px solid var(--border);color:var(--text);padding:5px 10px;border-radius:6px;font-size:12px}
.filter-chip{padding:3px 10px;border:1px solid var(--border);border-radius:12px;font-size:11px;cursor:pointer;color:var(--text-muted);background:transparent;white-space:nowrap}
.filter-chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.page{display:none}.page.active{display:flex;flex-direction:column;height:100%}
.page-content{flex:1;overflow-y:auto;padding:16px 20px 80px;min-height:0}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.kpi-card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 16px}
.kpi-card .label{color:var(--text-muted);font-size:11px;margin-bottom:2px}.kpi-card .value{font-size:22px;font-weight:700}
.kpi-clickable{cursor:pointer}.kpi-clickable.active-kpi{border:2px solid var(--accent)}
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.chart-area{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px}
.chart-area h2{font-size:13px;font-weight:600;margin-bottom:8px}.chart-wrap{position:relative;height:280px}
.asin-search{border:1px solid var(--border);border-radius:6px;padding:5px 10px;font-size:12px;background:var(--card-bg);color:var(--text);width:200px}
.asin-table-wrap{flex:1;overflow:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--card-bg);max-height:60vh}
.asin-table{width:max-content;min-width:100%;border-collapse:collapse;font-size:11px}
.asin-table th{position:sticky;top:0;background:#f8f9fb;z-index:3;padding:7px 10px;border-bottom:1px solid var(--border);color:var(--text);font-weight:600;white-space:nowrap;font-size:12px;cursor:pointer;user-select:none}
.asin-table td{padding:6px 10px;border-bottom:1px solid #f1f3f6;white-space:nowrap}.asin-table td.num{text-align:right}
.asin-table tbody tr:hover td{background:#fafbfc}
.summary-row td{font-weight:700;background:var(--accent-light)!important}
#import-section{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;margin-bottom:14px}
.import-head{display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none}
.import-row{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.type-radio{padding:4px 10px;border:1px solid var(--border);border-radius:6px;font-size:11px;cursor:pointer;color:var(--text-muted);background:transparent}.type-radio.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.drop-zone{border:2px dashed var(--border);border-radius:var(--radius);padding:16px 24px;text-align:center;color:var(--text-muted);cursor:pointer;flex:1;min-width:160px}
.upload-status{padding:6px 10px;border-radius:6px;font-size:11px;margin-top:8px;display:none}
.upload-status.show{display:block}.upload-status.ok{background:rgba(22,163,74,.12);color:var(--green)}.upload-status.err{background:rgba(220,38,38,.12);color:var(--red)}
.badge{padding:1px 5px;border-radius:8px;font-size:8px;font-weight:600}
.badge-red{background:rgba(220,38,38,.15);color:var(--red)}.badge-green{background:rgba(22,163,74,.15);color:var(--green)}.badge-blue{background:rgba(37,99,235,.15);color:var(--accent)}.badge-purple{background:rgba(124,58,237,.15);color:var(--purple)}
.pivot-grid{display:flex;flex-direction:column;gap:14px}.pivot-block{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px}
.pivot-table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:6px;max-height:400px}
.pivot-table{width:max-content;min-width:100%;border-collapse:collapse;font-size:12px}
.pivot-table th{position:sticky;top:0;background:#f8f9fb;z-index:2;padding:7px 10px;font-weight:600;color:var(--text);white-space:nowrap;font-size:12px;border-bottom:1px solid var(--border)}
.pivot-table td{padding:6px 10px;border-bottom:1px solid #f1f3f6}.pivot-table .total-row td{font-weight:700;background:var(--accent-light)!important}
.pivot-table tbody tr:hover td{filter:brightness(0.97)}
.inv-pivot .total-row td{background:#eef1f4!important;border-top:2px solid var(--border)}
.alert-section{margin-bottom:12px;background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.alert-section h3{padding:10px 14px;font-size:13px;font-weight:600;cursor:pointer;user-select:none;display:flex;align-items:center;gap:8px}
.alert-section h3::before{content:"";width:8px;height:8px;border-radius:50%;flex-shrink:0}
.alert-sev-0 h3::before{background:var(--text-muted)}
.alert-sev-1 h3::before{background:var(--red)}
.alert-sev-2 h3::before{background:var(--green)}
.alert-sev-3 h3::before{background:var(--orange)}
.alert-sev-4 h3::before{background:var(--purple)}.alert-sev-1 h3{border-left:3px solid var(--red)}.alert-sev-2 h3{border-left:3px solid var(--green)}.alert-sev-3 h3{border-left:3px solid var(--orange)}.alert-sev-4 h3{border-left:3px solid var(--purple)}.alert-sev-0 h3{border-left:3px solid var(--text-muted)}
.alert-table{width:max-content;min-width:100%;border-collapse:collapse;font-size:12px}
.alert-table th{position:sticky;top:0;background:#f8f9fb;z-index:2;padding:7px 10px;border-bottom:1px solid var(--border);color:var(--text);font-size:12px;font-weight:600}
.alert-table td{padding:6px 10px;border-bottom:1px solid #f1f3f6;white-space:nowrap}
.alert-table tbody tr:hover td{background:#fafbfc}
.btn-primary{padding:6px 16px;border:none;border-radius:6px;background:var(--accent);color:#fff;font-size:12px;cursor:pointer;font-weight:500}.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-sm{padding:4px 10px;border:1px solid var(--border);border-radius:6px;background:var(--card-bg);color:var(--text-muted);font-size:11px;cursor:pointer}.btn-sm:hover{color:var(--text);border-color:var(--accent)}
.clear-btn{opacity:.4;cursor:pointer}.clear-btn.active{opacity:1;color:var(--red)}
.import-detail{padding:6px 10px;margin-top:6px;border-radius:6px;font-size:11px;display:none;max-height:140px;overflow-y:auto;background:var(--accent-light)}.import-detail.show{display:block}
.empty-state{text-align:center;padding:60px 20px;color:var(--text-muted)}.empty-state h3{font-size:18px;margin-bottom:8px;color:var(--text)}.unmatched-list{color:var(--red);font-size:10px;margin-top:4px}
.theme-btn{display:flex;align-items:center;gap:6px;padding:8px 12px;width:100%;border:none;border-radius:6px;cursor:pointer;background:transparent;color:var(--text-muted);font-size:12px}
</style>
</head>
<body>
<div class="sidebar">
<div class="sidebar-nav">
<div class="nav-item active" onclick="goPage('pivot')"><span class="nav-ico">📋</span><span class="nav-txt">进销存总览</span></div>
<div class="nav-item" onclick="goPage('stock')"><span class="nav-ico">📊</span><span class="nav-txt">库存结构</span></div>
<div class="nav-item" onclick="goPage('ratio')"><span class="nav-ico">📈</span><span class="nav-txt">库销比分析</span></div>
<div class="nav-item" onclick="goPage('change')"><span class="nav-ico">📦</span><span class="nav-txt">库存变化</span></div>
<div class="nav-item" onclick="goPage('alerts')"><span class="nav-ico">⚠</span><span class="nav-txt">运营洞察</span></div>
</div>
<div class="sidebar-footer"><button class="theme-btn" onclick="togglePin()" id="pinBtn">📌 固定侧栏</button><button class="theme-btn" onclick="toggleTheme()">🌙 深色模式</button></div>
</div>

<div class="main">
<!-- Panel 1: 进销存总览 -->
<div class="page active" id="pg-pivot">
<div class="page-header"><h1>进销存总览</h1><span id="clock" class="date" style="font-size:12px;color:var(--accent);font-weight:600"></span><span id="ts0" class="date">加载中...</span>
<div class="controls"><span id="ds"></span><button class="btn-sm" onclick="exportPivotCSV()">📥 导出CSV</button><button class="btn-sm" style="color:var(--red);border-color:var(--red)" onclick="resetAll()">↺ 重置</button></div></div>
<div class="page-content">
<div id="import-section"><div class="import-head" onclick="toggleImport()"><h2 style="margin:0">导入数据（总表）</h2><span id="importArrow" style="font-size:10px;color:var(--text-muted)">▲ 收起</span></div>
<div id="import-body">
<div style="display:flex;gap:12px;align-items:center"><div class="drop-zone" onclick="document.getElementById('mainFile').click()" style="flex:1;min-width:280px;padding:20px"><div style="font-size:14px;font-weight:600">点击或拖拽上传总表</div><div style="font-size:11px;color:var(--text-muted)">自动识别6个子表</div></div><div><a class="btn-primary" href="库存看板数据-模板.xlsx" download style="text-decoration:none">下载模板</a></div></div>
<input type="file" id="mainFile" accept=".xlsx,.xls" style="display:none" onchange="handleFullDataImport({target:this})"><div id="uploadProgress" style="display:none;margin-top:8px;padding:6px 12px;background:rgba(9,105,218,0.06);border-radius:6px;font-size:12px;color:var(--accent)"></div>
</div></div>
<div class="pivot-block" id="sumBlock">
<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap"><span style="font-size:12px;color:var(--text-muted)">数据源：</span>
<span class="filter-chip active" id="sumChipFba" onclick="setSumSrc('fba',this)">FBA</span>
<span class="filter-chip" id="sumChipPo" onclick="setSumSrc('po',this)">PO</span>
<span class="filter-chip" id="sumChipOs" onclick="setSumSrc('overseas',this)">海外仓</span>
<span class="filter-chip" id="sumChipLo" onclick="setSumSrc('local',this)">本地</span>
<span style="margin-left:auto;font-size:11px;color:var(--text-muted)" id="sumDesc"></span></div>
<div class="chart-grid">
<div class="chart-area"><h2>各品类·库存与销量</h2><div class="chart-wrap" style="height:260px"><canvas id="sumCat"></canvas></div></div>
<div class="chart-area"><h2>库销比分布</h2><div class="chart-wrap" style="height:260px"><canvas id="ratioPie"></canvas></div></div>
<div class="chart-area"><h2>各运营·库存与销量</h2><div class="chart-wrap" style="height:260px"><canvas id="sumOp"></canvas></div></div>
</div></div>
<div class="pivot-grid"><div class="pivot-block" id="catBlock"><p>等待数据...</p></div><div class="pivot-block" id="opBlock"><p>等待数据...</p></div></div>
<div class="pivot-block" id="mappingBlock" style="margin-top:12px"></div></div></div>

<!-- Panel 2: 库存结构 -->
<div class="page" id="pg-stock">
<div class="page-header"><h1>库存结构</h1><span id="ts1" class="date">-</span>
<div class="controls"><span class="filter-chip active" onclick="setStockFilter('all',this)">全部</span><span class="filter-chip" onclick="setStockFilter('SC',this)">SC</span><span class="filter-chip" onclick="setStockFilter('VC',this)">VC</span><select class="filter-select" id="fOpStock" onchange="renderStock()"><option value="">全部运营</option></select></div></div>
<div class="page-content"><div class="kpi-row" id="stockKpi"></div>
<div class="chart-grid">
<div class="chart-area"><h2>各运营·库存构成</h2><div class="chart-wrap"><canvas id="c1"></canvas></div></div>
<div class="chart-area"><h2>SC vs VC 销量</h2><div class="chart-wrap"><canvas id="c2"></canvas></div></div>
<div class="chart-area"><h2>各品类·库存分布</h2><div class="chart-wrap"><canvas id="c3"></canvas></div></div>
<div class="chart-area"><h2>各运营·库销比</h2><div class="chart-wrap"><canvas id="c4"></canvas></div></div>
<div class="chart-area"><h2>各品类·库销比</h2><div class="chart-wrap"><canvas id="c5"></canvas></div></div>
<div class="chart-area"><h2>商品状态分布</h2><div class="chart-wrap"><canvas id="c6"></canvas></div></div>
</div></div></div>

<!-- Panel 3: 库销比分析 -->
<div class="page" id="pg-ratio">
<div class="page-header"><h1>库销比分析</h1><span id="ts2" class="date">-</span>
<div class="controls"><button class="btn-sm" onclick="exportRatioCSV()">📥 导出CSV</button><button id="clearFilterBtn" class="btn-sm clear-btn" onclick="clearRatioFilters()">✕ 清除筛选</button></div></div>
<div class="page-content">
<div class="kpi-row" id="ratioKpi"></div>
<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap">
<input class="asin-search" id="rSearch" placeholder="搜索SKU/ASIN..." oninput="renderRatio()">
<select class="filter-select" id="fCatRatio" onchange="renderRatio()"><option value="">全部品类</option></select>
<select class="filter-select" id="fOpRatio" onchange="renderRatio()"><option value="">全部运营</option></select>
<select class="filter-select" id="fStatusR" onchange="renderRatio()"><option value="">全部状态</option></select>
<select class="filter-select" id="fGradeR" onchange="renderRatio()"><option value="">全部等级</option></select>
<span id="activeFilters" style="font-size:11px;color:var(--text-muted)">无</span>
</div>
<div class="asin-table-wrap"><table class="asin-table"><thead id="ratioHead"></thead><tbody id="ratioBody"></tbody></table></div>
<div class="chart-grid" style="margin-top:12px">
<div class="chart-area"><h2>各运营·库销比</h2><div class="chart-wrap"><canvas id="c7"></canvas></div></div>
<div class="chart-area"><h2>各品类·库销比</h2><div class="chart-wrap"><canvas id="c8"></canvas></div></div>
</div></div></div>

<!-- Panel 4: 运营洞察 -->
<div class="page" id="pg-alerts">
<div class="page-header"><h1>运营洞察</h1><span id="ts3" class="date">-</span>
<div class="controls">
<span class="filter-chip active" onclick="setAlertChannel('all',this)">全部</span>
<span class="filter-chip" onclick="setAlertChannel('FBA',this)">FBA</span>
<span class="filter-chip" onclick="setAlertChannel('PO',this)">PO</span>
<select class="filter-select" id="fOpAlerts" onchange="renderAlerts()"><option value="">全部运营</option></select>
<select class="filter-select" id="fCatAlerts" onchange="renderAlerts()"><option value="">全部品类</option></select>
<select class="filter-select" id="fChAlerts" onchange="renderAlerts()"><option value="">全部渠道</option></select>
<button class="btn-sm" onclick="exportAlertCSV()" style="margin-left:auto">📥 导出CSV</button>
</div></div>
<div class="page-content"><div class="kpi-row" id="alertKpi"></div><div id="alertSections"></div></div></div>

<!-- Panel 5: -->
<div class="page" id="pg-change">
<div class="page-header"><h1>库存变化</h1><span id="ts4" class="date">-</span>
<div class="controls">
<span id="snapInfo" style="font-size:11px;color:var(--text-muted);margin-right:12px">暂无上传</span>
<input class="asin-search" id="changeSearch" placeholder="搜索SKU/ASIN..." oninput="renderChange()" style="width:160px">
<select class="filter-select" id="fCatChange" onchange="renderChange()"><option value="">全部品类</option></select>
<select class="filter-select" id="fOpChange" onchange="renderChange()"><option value="">全部运营</option></select>
</div></div>
<div class="page-content">
<div class="kpi-row" id="changeKpi"></div>
<div id="changeSummary"></div>
<div style="margin-top:10px"><div id="changeDetail"></div></div>
</div></div>

</div>

// ── Helpers ──
function sn(v) { return Number(v) || 0; }
function fc(v) { return Math.round(sn(v)).toLocaleString('en-US'); }
function f2(v) { return sn(v).toFixed(2); }
function nk(s) { return String(s||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,''); }

// ── localStorage ──
function ls() {
    try { var v = localStorage.getItem(LK); return v ? JSON.parse(v) : null; } catch(e) { return null; }
}
function sd() {
    try { if (D && !D._imported) return; if (D) localStorage.setItem(LK, JSON.stringify(D)); } catch(e) {}
}

// ── Theme toggle ──
function toggleTheme() {
    var h = document.documentElement;
    var cur = h.getAttribute('data-theme');
    var next = cur === 'dark' ? 'light' : 'dark';
    h.setAttribute('data-theme', next);
    var btn = document.querySelector('.theme-btn');
    if (btn) btn.innerHTML = (next === 'dark' ? '\u2600 浅色模式' : '\uD83C\uDF19 深色模式');
}
// ── Sidebar pin ──
function togglePin() {
    var sb = document.querySelector('.sidebar');
    var pinned = sb.classList.toggle('pinned');
    try { localStorage.setItem('inv_dash_pin', pinned ? '1' : '0'); } catch(e) {}
    var b = document.getElementById('pinBtn');
    if (b) b.innerHTML = pinned ? '📌 取消固定' : '📌 固定侧栏';
}
(function(){ try { if (localStorage.getItem('inv_dash_pin') === '1') { document.querySelector('.sidebar').classList.add('pinned'); document.getElementById('pinBtn').innerHTML = '📌 取消固定'; } } catch(e){} })();

// ── Import collapse ──
function toggleImport(){
    var body=document.getElementById('import-body');
    var arr=document.getElementById('importArrow');
    if(!body)return;
    var open=body.style.display!=='none';
    body.style.display=open?'none':'';
    if(arr)arr.textContent=open?'▼ 展开':'▲ 收起';
}
// ── Real-time clock ──
function tick(){
    var el=document.getElementById('clock');if(!el)return;
    var n=new Date();
    var timeStr=n.toLocaleString('zh-CN',{hour12:false});
    var upd='';
    if(D&&D.ts){
        try{var dts=new Date(String(D.ts).replace(' ','T'));var isToday=dts.toDateString()===n.toDateString();upd=' | 数据更新于 '+D.ts+(isToday?' ✅':' (非今日)');}catch(e){upd=' | 数据更新于 '+D.ts;}
    }
    el.textContent=timeStr+upd;
}
setInterval(tick,1000);tick();

// ── Page navigation ──
function goPage(p) {
    pg = p;
    var tabs = {pivot:'总览', stock:'库存结构', ratio:'库销比', alerts:'洞察', change:'库存变化'};
    ['pivot','stock','ratio','alerts','change'].forEach(function(x) {
        var navs = document.querySelectorAll('.nav-item');
        for (var i = 0; i < navs.length; i++) {
            navs[i].classList.toggle('active', navs[i].textContent.indexOf(tabs[p]) >= 0);
        }
        var pgEl = document.getElementById('pg-' + x);
        if (pgEl) pgEl.classList.toggle('active', x === p);
    });
    if (D && D.items) refreshAll();
    else showEmpty();
}

// ── Empty state ──
function showEmpty() {
    var msg = '<div class="empty-state"><h3>\uD83D\uDCED 暂无数据</h3><p>请导入数据或检查网络连接</p></div>';
    var ids = ['catBlock','opBlock','mappingBlock','stockKpi','ratioKpi','ratioHead','ratioBody','alertKpi','alertSections'];
    ids.forEach(function(id) {
        var el = document.getElementById(id);
        if (el) el.innerHTML = id === 'catBlock' ? msg : '';
    });
}

// ── Update timestamps ──
function updateTimestamps() {
    var ts = D ? (D.ts || '本地数据') : '无';
    ['ts0','ts1','ts2','ts3'].forEach(function(id) {
        var el = document.getElementById(id);
        if (el) el.textContent = ts;
    });
    var ds = document.getElementById('ds');
    if (ds) {
        if (!D) ds.innerHTML = '';
        else if (D._imported) ds.innerHTML = '<span style="color:var(--orange)">\uD83D\uDCDD 已导入</span>';
        else ds.innerHTML = '<span style="color:var(--green)">\u2601 内嵌数据</span>';
    }
}

// ── Refresh all ──
function refreshAll() {
    if (!D || !D.items) { showEmpty(); return; }
    updateTimestamps();
    destroyCharts();
    if (pg === 'pivot') { renderPivot(); renderSumCharts(); }
    else if (pg === 'stock') renderStock();
    else if (pg === 'ratio') renderRatio();
    else if (pg === 'alerts') renderAlerts();
    else if (pg === 'change') renderChange();
}

// ── Summary charts (Panel 1) ──
var sumSrc = 'fba';
var SUM_FIELD = {fba:'fba_avail', po:'po_avail', overseas:'overseas_avail', local:'local_avail'};
var SUM_LABEL = {fba:'FBA在库', po:'PO在库', overseas:'海外仓在库', local:'本地仓在库'};
function setSumSrc(src, el){
    sumSrc = src;
    ['fba','po','overseas','local'].forEach(function(k){
        var c = document.getElementById('sumChip' + k.charAt(0).toUpperCase() + k.slice(1));
        if (c) c.classList.toggle('active', k === src);
    });
    renderSumCharts();
}
function renderSumCharts(){
    if (!D || !D.items) return;
    ['sumCat','ratioPie','sumOp'].forEach(function(k){ if(charts[k]){ charts[k].destroy(); delete charts[k]; } });
    var f = SUM_FIELD[sumSrc] || 'fba_avail';
    var byCat = {}, byOp = {};
    D.items.forEach(function(i){
        var c = i.category || '未分类', o = i.operator || '未分配';
        if (!byCat[c]) byCat[c] = {v:0, s:0};
        if (!byOp[o]) byOp[o] = {v:0, s:0};
        byCat[c].v += sn(i[f]); byCat[c].s += sn(i.sales_30d);
        byOp[o].v += sn(i[f]); byOp[o].s += sn(i.sales_30d);
    });
    var cats = Object.keys(byCat).sort(), ops = Object.keys(byOp).sort();
    var d = document.getElementById('sumDesc');
    if (d) d.textContent = SUM_LABEL[sumSrc] + ' + 近30天销量';
    var colors = ['#2563eb','#f59e0b','#16a34a','#7c3aed','#ec4899','#06b6d4','#ef4444','#84cc16'];
    function mkBar(id, labels, a, b){
        var el = document.getElementById(id); if (!el) return;
        charts[id] = new Chart(el, {
            data: {labels: labels, datasets: [
                {type:'bar', label: SUM_LABEL[sumSrc], data: a, backgroundColor: 'rgba(37,99,235,.75)', borderRadius: 4, yAxisID: 'y'},
                {type:'line', label: '近30天销量', data: b, borderColor: '#f59e0b', backgroundColor: 'rgba(245,158,11,.12)', borderWidth: 2, tension: .35, pointRadius: 3, yAxisID: 'y1'}
            ]},
            options: {responsive:true, maintainAspectRatio:false,
                plugins:{legend:{labels:{font:{size:11}}}},
                scales:{y:{beginAtZero:true, position:'left', ticks:{font:{size:10}}}, y1:{position:'right', grid:{drawOnChartArea:false}, ticks:{font:{size:10}}}}}
        });
    }
    mkBar('sumCat', cats, cats.map(function(c){return Math.round(byCat[c].v)}), cats.map(function(c){return Math.round(byCat[c].s)}));
    mkBar('sumOp', ops, ops.map(function(o){return Math.round(byOp[o].v)}), ops.map(function(o){return Math.round(byOp[o].s)}));
    // Pie: 5 种库销比（整体值）
    var T = {fba:0, fi:0, po:0, pi:0, os:0, lo:0, pu:0, s:0, fs:0, ps:0};
    D.items.forEach(function(i){
        T.fba += sn(i.fba_avail); T.fi += sn(i.fba_inbound); T.po += sn(i.po_avail); T.pi += sn(i.po_inbound);
        T.os += sn(i.overseas_avail); T.lo += sn(i.local_avail); T.pu += sn(i.purchase_inbound);
        T.s += sn(i.sales_30d); T.fs += sn(i.fba_sales_30d); T.ps += sn(i.po_sales_30d);
    });

// ── Chart management ──
function mkChart(id, config) {
    destroyChart(id);
    var canvas = document.getElementById(id);
    if (!canvas) return null;
    var ctx = canvas.getContext('2d');
    // 全局视觉默认值（参考 filter-weekly-report）
    if (typeof Chart !== 'undefined') {
        Chart.defaults.font.family = '-apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif';
        Chart.defaults.font.size = 11;
        Chart.defaults.color = '#6b7280';
        Chart.defaults.plugins.legend.labels.usePointStyle = true;
        Chart.defaults.plugins.legend.labels.boxWidth = 8;
        Chart.defaults.plugins.legend.labels.boxHeight = 8;
        Chart.defaults.plugins.legend.labels.padding = 12;
        Chart.defaults.plugins.legend.position = 'bottom';
        Chart.defaults.plugins.tooltip.backgroundColor = 'rgba(26,29,35,0.9)';
        Chart.defaults.plugins.tooltip.padding = 10;
        Chart.defaults.plugins.tooltip.cornerRadius = 6;
        Chart.defaults.plugins.tooltip.titleFont = { size: 12, weight: '600' };
        Chart.defaults.plugins.tooltip.bodyFont = { size: 11 };
    }
    // 浅灰网格线
    if (config.options && config.options.scales) {
        Object.keys(config.options.scales).forEach(function(s) {
            var sc = config.options.scales[s];
            if (sc.grid) { if (sc.grid.color === undefined) sc.grid.color = 'rgba(0,0,0,0.06)'; }
            if (sc.ticks) { sc.ticks.color = '#6b7280'; }
        });
    }
    // 柱状图圆角
    if (config.type === 'bar' && config.data && config.data.datasets) {
        config.data.datasets.forEach(function(ds) {
            if (ds.borderRadius === undefined) ds.borderRadius = 6;
            if (ds.borderSkipped === undefined) ds.borderSkipped = false;
            if ((config.type === 'pie' || config.type === 'doughnut') && ds.borderColor === undefined) ds.borderColor = '#fff';
            if ((config.type === 'pie' || config.type === 'doughnut') && ds.borderWidth === undefined) ds.borderWidth = 2;
            if (ds.maxBarThickness === undefined) ds.maxBarThickness = 28;
        });
    }
    // 折线图平滑 + 细线 + 圆点
    if (config.type === 'line' && config.data && config.data.datasets) {
        config.data.datasets.forEach(function(ds) {
            if (ds.tension === undefined) ds.tension = 0.15;
            if (ds.borderWidth === undefined) ds.borderWidth = 2;
            if (ds.pointRadius === undefined) ds.pointRadius = 3;
            if (ds.fill === undefined) ds.fill = false;
        });
    }
    charts[id] = new Chart(ctx, config);
    return charts[id];
}
function destroyChart(id) {
    if (charts[id]) { charts[id].destroy(); delete charts[id]; }
}
function destroyCharts() {
    for (var k in charts) { if (charts.hasOwnProperty(k)) { charts[k].destroy(); } }
    charts = {};
}

            plugins: {

                tooltip: {callbacks: {label: function(c){ return c.label + ': ' + Math.round(c.raw).toLocaleString(); }}}
            }
        }
    });
    
    // Chart 3: Category distribution (horizontal stacked bar, 按渠道口径)
    mkChart('c3', {
        type: 'bar',
        data: {
            labels: cats,
            datasets: segs.map(function(s){
                return {label: s.lb, data: cats.map(function(c){return byCat[c][s.k]||0;}), backgroundColor: s.c};
            })
        },
        options: {
            responsive: true, maintainAspectRatio: false, indexAxis: 'y',
            scales: { x: {stacked: true, beginAtZero: true}, y: {stacked: true} },
            plugins: {
                legend: {position: 'bottom'},
                tooltip: {callbacks: {label: function(c){ return c.dataset.label + ': ' + Math.round(c.raw).toLocaleString(); }}}
            }
        }
    });
    
    // Chart 4: 各运营·当前口径库销比
    var opWithSales = ops.filter(function(o){ var d=byOp[o]; return d.sl>0 && d.ts/d.sl<=200; });
    mkChart('c4', {
        type: 'bar',
        data: {
            labels: opWithSales,
            datasets: [{label: CH_LABEL[sf]+'库销比', data: opWithSales.map(function(o){var d=byOp[o]; return d.sl>0?+(d.ts/d.sl).toFixed(2):0;}), backgroundColor: '#3559c7', borderRadius:4}]
        },
        options: {
            responsive: true, maintainAspectRatio: false, scales:{y:{beginAtZero:true}},
            plugins: {
                legend: {position: 'bottom'},
                tooltip: {callbacks: {label: function(c){ return c.dataset.label + ': ' + c.raw.toFixed(2); }}}
            }
        }
    });
    
    // Chart 5: 各品类·当前口径库销比
    var catWithSales = cats.filter(function(c){
        var s = 0; d.forEach(function(i){ if(i.category === c) s += sn(i.sales_30d); }); return s > 0;
    });
    mkChart('c5', {
        type: 'bar',
        data: {
            labels: catWithSales,
            datasets: [{label: CH_LABEL[sf]+'库销比', data: catWithSales.map(function(c){
                var sk=0,sl=0; d.forEach(function(i){ if(i.category===c){ segs.forEach(function(s2){sk+=s2.f(i);}); sl+=sn(i.sales_30d); } }); return sl>0?+(sk/sl).toFixed(2):0;
            }), backgroundColor: '#2c855b', borderRadius:4}]
        },
        options: {
            responsive: true, maintainAspectRatio: false, scales:{y:{beginAtZero:true}},
            plugins: {
                legend: {position: 'bottom'},
                tooltip: {callbacks: {label: function(c){ return c.dataset.label + ': ' + c.raw.toFixed(2); }}}
            }
        }
    });
    
    // Chart 6: Product status distribution (stacked bar)
    var statusByOp = {};
    d.forEach(function(i) {
        var o = i.operator || '(\u672A\u5206\u914D)';
        var st = i.product_status || '\u7EF4\u7A33';
        if (!statusByOp[o]) statusByOp[o] = {};
        statusByOp[o][st] = (statusByOp[o][st] || 0) + 1;
    });
    mkChart('c6', {
        type: 'bar',
        data: {
            labels: ops,
            datasets: ['\u63A8\u65B0','\u6E05\u5E93','\u98CE\u9669','\u7EF4\u7A33'].map(function(s,i){
                return {
                    label: s,
                    data: ops.map(function(o){ return statusByOp[o] ? (statusByOp[o][s] || 0) : 0; }),
                    backgroundColor: ['#2c855b','#e5cf83','#c7484f','#8899cc'][i]
                };
            })
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            scales: { x: {stacked: true}, y: {stacked: true} },
            plugins: { legend: {position: 'bottom'} }
        }
    });
}

// ══════════════════════════════════════════════
// Panel 3: 库销比分析
// ══════════════════════════════════════════════
function fbaRatio(i) {
    var s = sn(i.sales_30d);
    return s > 0 ? (sn(i.fba_avail) + sn(i.fba_inbound)) / s : 0;
}
function poRatio(i) {
    var s = sn(i.sales_30d);
    return s > 0 ? (sn(i.po_avail) + sn(i.po_inbound)) / s : 0;
}
function offshoreRatio(i) {
    var s = sn(i.sales_30d);
    return s > 0 ? (sn(i.fba_avail) + sn(i.fba_inbound) + sn(i.po_avail) + sn(i.po_inbound) + sn(i.overseas_avail) + sn(i.overseas_inbound)) / s : 0;
}
function fullRatio(i) {
    var s = sn(i.sales_30d);
    return s > 0 ? (sn(i.fba_avail) + sn(i.fba_inbound) + sn(i.po_avail) + sn(i.po_inbound) + sn(i.overseas_avail) + sn(i.overseas_inbound) + sn(i.local_avail) + sn(i.purchase_inbound)) / s : 0;
}
function getValue(i, key) {
    var m = {
        fba_avail: sn(i.fba_avail), fba_inbound: sn(i.fba_inbound),
        po_avail: sn(i.po_avail), po_inbound: sn(i.po_inbound),
        overseas_avail: sn(i.overseas_avail), local_avail: sn(i.local_avail),
        sales_30d: sn(i.sales_30d),
        fbaRatio: fbaRatio(i), poRatio: poRatio(i),
        availRatio: (sn(i.fba_avail) + sn(i.po_avail)) / Math.max(sn(i.sales_30d), 0.01),
        fullRatio: fullRatio(i)
    };
    return m[key] || 0;
}

var RATIO_COLS = [
    {k:'fba_avail', l:'FBA\u53EF\u7528'}, {k:'fba_inbound', l:'FBA\u5728\u9014'},
    {k:'po_avail', l:'PO\u5728\u5E93'}, {k:'po_inbound', l:'PO\u5728\u9014'},
    {k:'overseas_avail', l:'\u6D77\u5916\u4ED3'}, {k:'local_avail', l:'\u672C\u5730'},
    {k:'sales_30d', l:'30\u5929\u9500\u91CF'}, {k:'fbaRatio', l:'FBA\u5E93\u9500\u6BD4'},
    {k:'poRatio', l:'PO\u5E93\u9500\u6BD4'}, {k:'availRatio', l:'\u53EF\u7528\u5E93\u9500\u6BD4'},
    {k:'fullRatio', l:'\u5168\u94FE\u8DEF\u5E93\u9500\u6BD4'}
];

function clickKPI(f) {
    rf = (rf === f) ? null : f;
    var allCards = document.querySelectorAll('#pg-ratio .kpi-clickable');
    for (var i = 0; i < allCards.length; i++) allCards[i].classList.remove('active-kpi');
    if (rf) {
        var el = document.getElementById('kpi-' + rf);
        if (el) el.classList.add('active-kpi');
    }
    renderRatio();
}

function clearRatioFilters() {
    rf = null; rs = ''; rg = ''; nf = {};
    document.getElementById('rSearch').value = '';
    document.getElementById('fOpRatio').value = '';
    document.getElementById('fStatusR').value = '';
    document.getElementById('fGradeR').value = '';
    renderRatio();
}

function showNumFilter(ci, th) {
    var existing = document.getElementById('nfp');
    if (existing) existing.remove();
    var colDef = RATIO_COLS[ci];
    if (!colDef) return;
    var filter = nf[ci] || {op: '>=', val: ''};
    
    var popup = document.createElement('div');
    popup.id = 'nfp';
    popup.style.cssText = 'position:fixed;z-index:1000;background:var(--card-bg);border:1px solid var(--border);border-radius:8px;padding:12px;box-shadow:0 4px 16px rgba(0,0,0,.2);min-width:220px';
    var rect = th.getBoundingClientRect();
    popup.style.left = Math.min(rect.left, window.innerWidth - 240) + 'px';
    popup.style.top = (rect.bottom + 4) + 'px';
    popup.innerHTML = '<div style="font-size:12px;font-weight:600;margin-bottom:8px">\u7B5B\u9009: ' + colDef.l + '</div>' +
        '<select id="nfOp" style="padding:4px 8px;border:1px solid var(--border);border-radius:4px;margin-right:6px;background:var(--card-bg);color:var(--text)">' +
        '<option value=">=">\u2265</option><option value="<=">\u2264</option><option value="=">=</option></select>' +
        '<input id="nfVal" type="number" step="any" value="' + filter.val + '" style="width:80px;padding:4px 8px;border:1px solid var(--border);border-radius:4px;background:var(--card-bg);color:var(--text)" placeholder="\u6570\u503C">' +
        '<div style="margin-top:8px;display:flex;gap:6px">' +
        '<button onclick="applyNumFilter(' + ci + ')" style="flex:1;padding:4px;border:none;border-radius:4px;background:var(--accent);color:#fff;cursor:pointer;font-size:11px">\u5E94\u7528</button>' +
        '<button onclick="clearNumFilter(' + ci + ')" style="flex:1;padding:4px;border:1px solid var(--border);border-radius:4px;background:transparent;color:var(--text-muted);cursor:pointer;font-size:11px">\u6E05\u9664</button>' +
        '</div>';
    document.body.appendChild(popup);
    document.getElementById('nfOp').value = filter.op;
    setTimeout(function() {
        document.getElementById('nfVal').focus();
        document.addEventListener('click', function closePopup(e) {
            if (!popup.contains(e.target) && e.target !== th) {
                popup.remove();
                document.removeEventListener('click', closePopup);
            }
        });
    }, 100);
}

function applyNumFilter(ci) {
    var opEl = document.getElementById('nfOp');
    var valEl = document.getElementById('nfVal');
    var op = opEl ? opEl.value : '>=';
    var val = valEl ? parseFloat(valEl.value) : NaN;
    if (isNaN(val) || val === '') { clearNumFilter(ci); return; }
    nf[ci] = {op: op, val: val};
    var popup = document.getElementById('nfp');
    if (popup) popup.remove();
    renderRatio();
}

function clearNumFilter(ci) {
    delete nf[ci];
    var popup = document.getElementById('nfp');
    if (popup) popup.remove();
    renderRatio();
}

function renderRatio() {
    if (!D || !D.items) return;
    var d = D.items.slice();
    
    // Search filter
    var q = document.getElementById('rSearch').value || '';
    if (q) {
        var terms = q.split(/[,\\s]+/).filter(Boolean);
        d = d.filter(function(i) {
            return terms.some(function(t) { return (i.sku||'').indexOf(t) >= 0 || (i.asin||'').indexOf(t) >= 0; });
        });
    }
    
    // Operator filter
    var opSel = document.getElementById('fOpRatio');
    if (opSel && opSel.value) d = d.filter(function(i) { return i.operator === opSel.value; });
    
    // Status & grade filters
    rs = document.getElementById('fStatusR').value;
    rg = document.getElementById('fGradeR').value;
    if (rs) d = d.filter(function(i) { return i.product_status === rs; });
    if (rg) d = d.filter(function(i) { return i.product_grade === rg; });
    
    // Numeric filters
    for (var ci in nf) {
        if (!nf.hasOwnProperty(ci)) continue;
        var n = nf[ci];
        var colDef = RATIO_COLS[parseInt(ci)];
        if (!colDef) continue;
        d = d.filter(function(i) {
            var v = getValue(i, colDef.k);
            if (n.op === '>=') return v >= n.val;
            if (n.op === '<=') return v <= n.val;
            return v === n.val;
        });
    }
    
    // KPI filter
    if (rf) {
        d = d.filter(function(i) {
            var fr = fullRatio(i);
            if (rf === 'dead') return sn(i.sales_30d) === 0;
            if (rf === 'risk') return sn(i.sales_30d) > 0 && fr < 3;
            if (rf === 'healthy') return sn(i.sales_30d) > 0 && fr >= 3 && fr < 7;
            if (rf === 'slow') return sn(i.sales_30d) > 0 && fr >= 7 && fr < 12;
            if (rf === 'high') return sn(i.sales_30d) > 0 && fr >= 12;
            return true;
        });
    }
    
    // Compute KPI counts from ALL items (unfiltered)
    var dead = 0, risk = 0, healthy = 0, slow = 0, high = 0;
    D.items.forEach(function(i) {
        var fr = fullRatio(i);
        if (sn(i.sales_30d) === 0) dead++;
        else if (fr < 3) risk++;
        else if (fr < 7) healthy++;
        else if (fr < 12) slow++;
        else high++;
    });
    
    document.getElementById('ratioKpi').innerHTML =
        '<div class="kpi-card kpi-clickable" id="kpi-dead" onclick="clickKPI(\'dead\')"><div class="label">0\u52A8\u9500</div><div class="value" style="color:var(--text-muted)">' + dead + '</div></div>' +
        '<div class="kpi-card kpi-clickable" id="kpi-risk" onclick="clickKPI(\'risk\')"><div class="label">\u98CE\u9669 &lt;3</div><div class="value" style="color:var(--red)">' + risk + '</div></div>' +
        '<div class="kpi-card kpi-clickable" id="kpi-healthy" onclick="clickKPI(\'healthy\')"><div class="label">\u5065\u5EB7 3-7</div><div class="value" style="color:var(--green)">' + healthy + '</div></div>' +
        '<div class="kpi-card kpi-clickable" id="kpi-slow" onclick="clickKPI(\'slow\')"><div class="label">\u504F\u6162 7-12</div><div class="value" style="color:var(--orange)">' + slow + '</div></div>' +
        '<div class="kpi-card kpi-clickable" id="kpi-high" onclick="clickKPI(\'high\')"><div class="label">\u504F\u9AD8 &gt;12</div><div class="value" style="color:var(--purple)">' + high + '</div></div>' +
        '<div class="kpi-card"><div class="label">\u7B5B\u9009\u7ED3\u679C</div><div class="value">' + d.length + '</div></div>';
    
    if (rf) {
        var ek = document.getElementById('kpi-' + rf);
        if (ek) ek.classList.add('active-kpi');
    }
    
    // Active filters display
    var hasFilter = !!rf || Object.keys(nf).length > 0 || !!rs || !!rg || !!(opSel && opSel.value);
    var clearBtn = document.getElementById('clearFilterBtn');
    if (clearBtn) {
        clearBtn.style.opacity = hasFilter ? '1' : '0.4';
        if (hasFilter) clearBtn.classList.add('active');
        else clearBtn.classList.remove('active');
    }
    
    var activeFilters = [];
    if (rf) {
        var labels = {dead:'0\u52A8\u9500', risk:'\u98CE\u9669<3', healthy:'\u5065\u5EB73-7', slow:'\u504F\u61627-12', high:'\u504F\u9AD8>12'};
        activeFilters.push(labels[rf]);
    }
    for (var ci2 in nf) {
        if (!nf.hasOwnProperty(ci2)) continue;
        var n2 = nf[ci2];
        var cd2 = RATIO_COLS[parseInt(ci2)];
        if (cd2) activeFilters.push(cd2.l + ' ' + n2.op + ' ' + n2.val);
    }
    if (opSel && opSel.value) activeFilters.push('\u8FD0\u8425:' + opSel.value);
    if (rs) activeFilters.push('\u72B6\u6001:' + rs);
    if (rg) activeFilters.push('\u7B49\u7EA7:' + rg);
    document.getElementById('activeFilters').textContent = activeFilters.length > 0 ? activeFilters.join(' | ') : '\u65E0';
    
    // Table
    var cols = ['SKU','ASIN','\u54C1\u7C7B','\u8FD0\u8425','VC/SC','FBA\u53EF\u7528','FBA\u5728\u9014','PO\u5728\u5E93','PO\u5728\u9014','\u6D77\u5916\u4ED3','\u672C\u5730','SC\u9500\u91CF','VC\u9500\u91CF','30\u5929\u9500\u91CF','FBA\u5E93\u9500\u6BD4','PO\u5E93\u9500\u6BD4','\u53EF\u7528\u5E93\u9500\u6BD4','\u5168\u94FE\u8DEF\u5E93\u9500\u6BD4','\u72B6\u6001','\u7B49\u7EA7'];
    var sums = {fa:0, fi:0, pa:0, pi:0, oa:0, lo:0, sc:0, vc:0, sl:0};
    var ratioSums = {fr:0, pr:0, ar:0, fu:0};
    var cnt = d.length || 1;
    d.forEach(function(i) {
        sums.fa += sn(i.fba_avail); sums.fi += sn(i.fba_inbound);
        sums.pa += sn(i.po_avail); sums.pi += sn(i.po_inbound);
        sums.oa += sn(i.overseas_avail); sums.lo += sn(i.local_avail);
        sums.sc += sn(i.fba_sales_30d); sums.vc += sn(i.po_sales_30d);
        sums.sl += sn(i.sales_30d);
        ratioSums.fr += fbaRatio(i); ratioSums.pr += poRatio(i);
        ratioSums.ar += (sn(i.fba_avail) + sn(i.po_avail)) / Math.max(sn(i.sales_30d), 0.01);
        ratioSums.fu += fullRatio(i);
    });
    
    var summaryRow = '<tr class="summary-row"><td>\u2211/x\u0304</td><td></td><td></td><td></td><td></td>' +
        '<td class="num">' + fc(sums.fa) + '</td><td class="num">' + fc(sums.fi) + '</td>' +
        '<td class="num">' + fc(sums.pa) + '</td><td class="num">' + fc(sums.pi) + '</td>' +
        '<td class="num">' + fc(sums.oa) + '</td><td class="num">' + fc(sums.lo) + '</td>' +
        '<td class="num">' + fc(sums.sc) + '</td><td class="num">' + fc(sums.vc) + '</td><td class="num">' + fc(sums.sl) + '</td>' +
        '<td class="num">x\u0304' + f2(ratioSums.fr/cnt) + '</td><td class="num">x\u0304' + f2(ratioSums.pr/cnt) + '</td>' +
        '<td class="num">x\u0304' + f2(ratioSums.ar/cnt) + '</td><td class="num">x\u0304' + f2(ratioSums.fu/cnt) + '</td>' +
        '<td></td><td></td></tr>';
    
    var headerHtml = '<tr>';
    cols.forEach(function(c, i) {
        var rc = RATIO_COLS.find(function(r){ return r.l === c; });
        if (rc) {
            var idx = RATIO_COLS.indexOf(rc);
            headerHtml += '<th style="cursor:pointer" onclick="showNumFilter(' + idx + ',this)">' + c + (nf[idx] ? ' \uD83D\uDD3D' : ' \u25BE') + '</th>';
        } else {
            headerHtml += '<th>' + c + '</th>';
        }
    });
    headerHtml += '</tr>';
    document.getElementById('ratioHead').innerHTML = headerHtml;
    
    var body = '';
    d.slice(0, 500).forEach(function(i) {
        var fr = fullRatio(i), fbr = fbaRatio(i), pbr = poRatio(i);
        var avr = (sn(i.fba_avail) + sn(i.po_avail)) / Math.max(sn(i.sales_30d), 0.01);
        body += '<tr><td>' + i.sku + '</td><td><a href="https://www.amazon.com/dp/' + i.asin + '" target="_blank">' + i.asin + '</a></td>' +
            '<td>' + (i.category||'') + '</td><td>' + (i.operator||'') + '</td><td>' + (i.vc_sc||'SC') + '</td>' +
            '<td class="num">' + fc(i.fba_avail) + '</td><td class="num">' + fc(i.fba_inbound) + '</td>' +
            '<td class="num">' + fc(i.po_avail) + '</td><td class="num">' + fc(i.po_inbound) + '</td>' +
            '<td class="num">' + fc(i.overseas_avail) + '</td><td class="num">' + fc(i.local_avail) + '</td>' +
            '<td class="num">' + fc(i.fba_sales_30d||0) + '</td><td class="num">' + fc(i.po_sales_30d||0) + '</td><td class="num">' + fc(i.sales_30d) + '</td>' +
            '<td class="num">' + f2(fbr) + '</td><td class="num">' + f2(pbr) + '</td>' +
            '<td class="num">' + f2(avr) + '</td><td class="num">' + f2(fr) + '</td>' +
            '<td>' + (i.product_status||'') + '</td><td>' + (i.product_grade||'') + '</td></tr>';
    });
    document.getElementById('ratioBody').innerHTML = summaryRow + body;
    
    // Ratio charts
    renderRatioCharts(d);
}

function renderRatioCharts(d) {
    // Operator ratio chart
    var byOp = {};
    d.forEach(function(i) {
        var o = i.operator || '(\u672A\u5206\u914D)';
        if (!byOp[o]) byOp[o] = {fa:0, fi:0, pa:0, pi:0, oa2:0, oi:0, lo:0, pu:0, sl:0};
        byOp[o].fa += sn(i.fba_avail); byOp[o].fi += sn(i.fba_inbound);
        byOp[o].pa += sn(i.po_avail); byOp[o].pi += sn(i.po_inbound);
        byOp[o].oa2 += sn(i.overseas_avail); byOp[o].oi += sn(i.overseas_inbound);
        byOp[o].lo += sn(i.local_avail); byOp[o].pu += sn(i.purchase_inbound);
        byOp[o].sl += sn(i.sales_30d);
    });
    var ops = Object.keys(byOp).sort().filter(function(o){ var a=byOp[o]; if(a.sl<=0)return false; if((a.fa+a.fi+a.pa+a.pi+a.oa2+a.oi+a.lo+a.pu)/a.sl>200)return false; return true; });
    
    mkChart('c7', {
        type: 'bar',
        data: {
            labels: ops,
            datasets: [
                {label: 'FBA\u5E93\u9500\u6BD4', data: ops.map(function(o){ var a=byOp[o]; return a.sl>0?(a.fa+a.fi)/a.sl:0; }), backgroundColor: '#2563eb'},
                {label: 'PO\u5E93\u9500\u6BD4', data: ops.map(function(o){ var a=byOp[o]; return a.sl>0?(a.pa+a.pi)/a.sl:0; }), backgroundColor: '#f59e0b'},
                {label: '\u53EF\u7528\u5E93\u9500\u6BD4', data: ops.map(function(o){ var a=byOp[o]; return a.sl>0?(a.fa+a.pa)/a.sl:0; }), backgroundColor: '#16a34a'},
                {label: '\u79BB\u5CB8\u5E93\u9500\u6BD4', data: ops.map(function(o){ var a=byOp[o]; return a.sl>0?(a.fa+a.fi+a.pa+a.pi+a.oa2+a.oi)/a.sl:0; }), backgroundColor: '#06b6d4'},
                {label: '\u6210\u54C1\u5E93\u9500\u6BD4', data: ops.map(function(o){ var a=byOp[o]; return a.sl>0?(a.fa+a.fi+a.pa+a.pi+a.oa2+a.oi+a.lo)/a.sl:0; }), backgroundColor: '#8b5cf6'},
                {label: '\u5168\u94FE\u8DEF\u5E93\u9500\u6BD4', data: ops.map(function(o){ var a=byOp[o]; return a.sl>0?(a.fa+a.fi+a.pa+a.pi+a.oa2+a.oi+a.lo+a.pu)/a.sl:0; }), backgroundColor: '#dc2626'}
            ]
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            plugins: {
                legend: {position: 'bottom'},
                tooltip: {callbacks: {label: function(c){ return c.dataset.label + ': ' + c.raw.toFixed(1); }}}
            }
        }
    });
    
    // Category ratio chart
    var byCat = {};
    d.forEach(function(i) {

function classifyAlert(i, ch) {
    var s30 = sn(i.sales_30d);
    if (s30 === 0) return 0;
    var ratio;
    if (ch === 'FBA') ratio = (sn(i.fba_avail) + sn(i.fba_inbound)) / s30;
    else if (ch === 'PO') ratio = (sn(i.po_avail) + sn(i.po_inbound)) / s30;
    else ratio = (sn(i.fba_avail) + sn(i.fba_inbound) + sn(i.po_avail) + sn(i.po_inbound) + sn(i.overseas_avail) + sn(i.overseas_inbound)) / s30;
    if (ratio < 2) return 0;
    if (ratio > 2 && ratio <= 4) return 1;
    if (ratio >= 5 && ratio <= 7) return 2;
    if (ratio > 8) return 3;
    return 4;
}

}

function findColIdx(headers, keywords) {
    for (var i = 0; i < headers.length; i++) {
        var h = String(headers[i] || '').trim().toLowerCase();
        for (var j = 0; j < keywords.length; j++) {
            if (h === keywords[j].toLowerCase() || h.indexOf(keywords[j].toLowerCase()) >= 0) {
                return i;
            }
        }
    }
    return -1;
}

function scoreHeaders(row) {
    var s = 0;
    var keywords = ['sku','asin','FBA','PO','\u5E93\u5B58','\u9500\u91CF','\u5728\u5E93','\u5728\u9014','\u6D77\u5916','\u672C\u5730','\u8FD0\u8425','\u54C1\u7C7B'];
    for (var i = 0; i < row.length; i++) {
        var h = String(row[i] || '').trim().toLowerCase();
        for (var j = 0; j < keywords.length; j++) {
            if (h.indexOf(keywords[j].toLowerCase()) >= 0) { s++; break; }
        }
    }
    return s;
}

function doImport() {
    if (!importType || !importFile) return;
    var btn = document.getElementById('btnImport');
    btn.disabled = true;
    btn.textContent = '\u5BFC\u5165\u4E2D...';
    
    var reader = new FileReader();
    reader.onload = function(e) {
        try {
            var data = new Uint8Array(e.target.result);
            var wb = XLSX.read(data, {type: 'array'});
            var ws = wb.Sheets[wb.SheetNames[0]];
            var rows = XLSX.utils.sheet_to_json(ws, {header: 1, defval: ''});
            
            // Auto-detect header row
            var bestRow = -1, bestScore = 0;
            for (var i = 0; i < Math.min(100, rows.length); i++) {
                var sc = scoreHeaders(rows[i]);
                if (sc > bestScore) { bestScore = sc; bestRow = i; }
            }
            if (bestRow < 0) {
                showImportStatus('err', '\u672A\u627E\u5230\u8868\u5934');
                btn.disabled = false;
                btn.textContent = '\u8BF7\u5148\u9009\u62E9\u6587\u4EF6';
                return;
            }
            
            var headers = rows[bestRow].map(function(h) { return String(h || '').trim(); });
            var dataRows = rows.slice(bestRow + 1).filter(function(r) {
                return r && r.some(function(c) { return c !== '' && String(c).trim() !== ''; });
            });
            
            // Find columns
            var codeCol = findColIdx(headers, ['\u4EA7\u54C1\u7F16\u7801','\u5546\u54C1\u7F16\u7801','\u5546\u7F16','\u5546\u5BB6\u7F16\u7801','seller sku']);
            var skuCol = findColIdx(headers, ['SKU','\u5E73\u53F0sku','\u5546\u54C1sku','seller sku','sku\u7F16\u7801']);
            var asinCol = findColIdx(headers, ['ASIN','\u5E73\u53F0\u9500\u552E\u7F16\u7801','asin']);
            var opCol = findColIdx(headers, ['\u8FD0\u8425','\u8D1F\u8D23\u4EBA','\u9500\u552E\u5458','\u8FD0\u8425\u4EBA\u5458','\u6240\u5C5E\u8FD0\u8425']);
            
            // Build lookup map
            var lookup = {};
            var excelKeys = [];
            dataRows.forEach(function(rw) {
                var keys = [];
                if (codeCol >= 0) keys.push(String(rw[codeCol] || '').trim());
                if (skuCol >= 0) keys.push(String(rw[skuCol] || '').trim());
                if (asinCol >= 0) keys.push(String(rw[asinCol] || '').trim());
                
                var entry = {_k: keys};
                if (importType === 'vc') {
                    entry.pa = sn(rw[findColIdx(headers, ['PO\u5728\u5E93','PO\u53EF\u7528','\u5728\u5E93','\u53EF\u552E\u5E93\u5B58','\u53EF\u552E','\u53EF\u7528\u5E93\u5B58'])]);
                    entry.pi = sn(rw[findColIdx(headers, ['PO\u5728\u9014','\u5728\u9014','\u5728\u9014\u5E93\u5B58','\u5F85\u5165\u5E93'])]);
                    entry.ps = sn(rw[findColIdx(headers, ['VC\u8FD130\u5929','\u8FD130\u5929\u9500\u91CF','SC\u9500\u91CF','VC\u9500\u91CF','30\u5929\u9500\u91CF','30\u5929','\u9500\u91CF','\u8FD130\u5929'])]);
                } else if (importType === 'fba_wh') {
                    entry.fa = sn(rw[findColIdx(headers, ['FBA\u5728\u5E93','FBA\u53EF\u7528','\u53EF\u7528','\u53EF\u552E\u5E93\u5B58','fba\u53EF\u552E','fba\u5728\u5E93'])]);
                    entry.fi = sn(rw[findColIdx(headers, ['FBA\u5728\u9014','fba\u5F85\u5165\u5E93'])]);
                    entry.oa = sn(rw[findColIdx(headers, ['\u6D77\u5916\u4ED3\u53EF\u7528','\u6D77\u5916\u4ED3\u5728\u5E93','\u6D77\u5916\u4ED3','\u6D77\u5916\u4ED3\u53EF\u552E','\u6D77\u5916'])]);
                    entry.oi = sn(rw[findColIdx(headers, ['\u6D77\u5916\u4ED3\u5728\u9014','\u6D77\u5916\u5728\u9014'])]);
                    entry.la = sn(rw[findColIdx(headers, ['\u672C\u5730\u4ED3','\u672C\u5730\u53EF\u7528','\u672C\u5730\u53EF\u552E','\u672C\u5730','\u672C\u5730\u5E93\u5B58'])]);
                    entry.pu = sn(rw[findColIdx(headers, ['\u91C7\u8D2D\u5728\u9014','\u91C7\u8D2D\u5F85\u5165\u5E93'])]);
                } else {
                    entry.sl = sn(rw[findColIdx(headers, ['\u9500\u91CF','\u9500\u552E','QTY','\u8FD130\u5929','SC\u9500\u91CF','VC\u9500\u91CF','30\u5929\u9500\u91CF','30\u5929','\u8FD130\u5929\u9500\u91CF','\u6708\u9500\u91CF','\u51FA\u5E93\u9500\u91CF'])]);
                }
                if (opCol >= 0) entry.op = String(rw[opCol] || '').trim();
                
                keys.forEach(function(k) {
                    if (k && k !== '#N/A' && k !== '0') {
                        excelKeys.push(k);
                        lookup[nk(k)] = entry;
                        lookup[k] = entry;
                    }
                });
            });
            
            // Match and update
            var updated = 0, matched = 0;
            var dataUnmatched = [], excelUnmatched = [], detailLog = [];
            var emit = {};
            
            if (D && D.items) {
                D.items.forEach(function(di) {
                    var m = lookup[nk(di.sku)] || lookup[nk(di.asin)] || lookup[di.sku] || lookup[di.asin];
                    if (!m) {
                        // Fuzzy match
                        var ns = nk(di.sku), na = nk(di.asin);
                        for (var k in lookup) {
                            if (k.length < 3) continue;
                            if ((ns && (k.indexOf(ns) >= 0 || ns.indexOf(k) >= 0)) || (na && (k.indexOf(na) >= 0 || na.indexOf(k) >= 0))) {
                                m = lookup[k]; break;
                            }
                        }
                    }
                    if (!m) { dataUnmatched.push(di.sku + '/' + di.asin); return; }
                    matched++;
                    (m._k || []).forEach(function(k) { if (k) emit[nk(k)] = true; });
                    
                    var changes = [];
                    if (importType === 'vc') {
                        if (m.pa !== undefined) { di.po_avail = m.pa; changes.push('PO\u5728\u5E93=' + fc(m.pa)); }
                        if (m.pi !== undefined) { di.po_inbound = m.pi; changes.push('PO\u5728\u9014=' + fc(m.pi)); }
                        if (m.ps !== undefined) { di.po_sales_30d = m.ps; changes.push('VC\u9500\u91CF=' + fc(m.ps)); }
                    } else if (importType === 'fba_wh') {
                        if (m.fa !== undefined) { di.fba_avail = m.fa; changes.push('FBA=' + fc(m.fa)); }
                        if (m.fi !== undefined) { di.fba_inbound = m.fi; changes.push('FBA\u5728\u9014=' + fc(m.fi)); }
                        if (m.oa !== undefined) { di.overseas_avail = m.oa; changes.push('\u6D77\u5916\u4ED3=' + fc(m.oa)); }
                        if (m.oi !== undefined) { di.overseas_inbound = m.oi; changes.push('\u6D77\u5916\u5728\u9014=' + fc(m.oi)); }
                        if (m.la !== undefined) { di.local_avail = m.la; changes.push('\u672C\u5730=' + fc(m.la)); }
                        if (m.pu !== undefined) { di.purchase_inbound = m.pu; changes.push('\u91C7\u8D2D\u5728\u9014=' + fc(m.pu)); }
                    } else {
                        if (m.sl !== undefined) { di.sales_30d = m.sl; changes.push('\u9500\u91CF=' + fc(m.sl)); }
                    }
                    if (m.op && m.op !== '\u672A\u77E5' && m.op !== '') { di.operator = m.op; changes.push('\u8FD0\u8425\u2192' + m.op); }
                    if (changes.length > 0) { updated++; if (detailLog.length < 15) detailLog.push(di.sku + ': ' + changes.join(', ')); }
                });
            }
            
            // Excel unmatched
            for (var k in lookup) {
                if (lookup[k]._k && !emit[nk(k)]) {
                    (lookup[k]._k || []).forEach(function(k2) {
                        if (k2 && !emit[nk(k2)]) excelUnmatched.push(k2);
                    });
                }
            }
            var seen = {};
            excelUnmatched = excelUnmatched.filter(function(k) {
                var n = nk(k);
                if (seen[n]) return false; seen[n] = true; return true;
            });
            
            var detailHtml = '<b>\u5BFC\u5165\u5B8C\u6210</b><br>Excel:' + dataRows.length + '\u884C | \u5339\u914D:<b style="color:var(--green)">' + matched + '</b> | \u66F4\u65B0:<b style="color:var(--accent)">' + updated + '</b>';
            if (dataUnmatched.length > 0) detailHtml += ' | \u6570\u636E\u672A\u5339\u914D:<span style="color:var(--red)">' + dataUnmatched.length + '</span>';
            if (excelUnmatched.length > 0) detailHtml += ' | Excel\u672A\u5339\u914D:<span style="color:var(--orange)">' + excelUnmatched.length + '</span>';
            if (detailLog.length > 0) detailHtml += '<br><span style="font-size:10px">\u66F4\u65B0:' + detailLog.join('<br>') + '</span>';
            if (dataUnmatched.length > 0 && dataUnmatched.length <= 20) detailHtml += '<br><span style="font-size:10px;color:var(--red)">\u26A0 \u6570\u636E\u672A\u5339\u914D(\u524D20):' + dataUnmatched.slice(0,20).join(', ') + '</span>';
            if (excelUnmatched.length > 0 && excelUnmatched.length <= 15) detailHtml += '<br><span style="font-size:10px;color:var(--orange)">\uD83D\uDCCB Excel\u672A\u5339\u914D(\u524D15):' + excelUnmatched.slice(0,15).join(', ') + '</span>';
            
            var detailEl = document.getElementById('importDetail');
            if (detailEl) {
                detailEl.innerHTML = detailHtml;
                detailEl.classList.add('show');
            }
            showImportStatus(matched > 0 ? 'ok' : 'info', '\u5BFC\u5165:' + updated + '\u66F4\u65B0,' + matched + '\u5339\u914D' + (excelUnmatched.length > 0 ? ', ' + excelUnmatched.length + ' Excel\u672A\u5339\u914D' : ''));
            D._imported = true;
            sd();
            populateFilters();
            refreshAll();
        } catch(er) {
            showImportStatus('err', er.message);
            console.error(er);
        }
        btn.disabled = false;
        btn.textContent = '\u8BF7\u5148\u9009\u62E9\u6587\u4EF6';
    };
    reader.readAsArrayBuffer(importFile);
}

// Initialization

function initData() {
    try {
        // Try localStorage first
        var saved = ls();
        if (saved) {
            D = saved;
            applyOpMapping();
        }
        
        // Fall back to EMBED_DATA
        if (!D && typeof EMBED_DATA !== 'undefined' && EMBED_DATA) {
            D = JSON.parse(JSON.stringify(EMBED_DATA));
            D._imported = false;
            if (EMBED_DATA.mapping && Object.keys(EMBED_DATA.mapping).length > 0) {
                SKU_OP = EMBED_DATA.mapping;
                try { localStorage.setItem(LK2, JSON.stringify(EMBED_DATA.mapping)); } catch(e) {}
            }
        }
        
        // Try SKU_OP from localStorage
        if (Object.keys(SKU_OP).length === 0) {
            try {
                var savedOp = localStorage.getItem(LK2);
                if (savedOp) SKU_OP = JSON.parse(savedOp);
            } catch(e) {}
        }
        
        if (D && D.items) {
            applyOpMapping();
            sd();
            populateFilters();
            refreshAll();
        } else {
            showEmpty();
        }
    } catch(err) {
        var el = document.getElementById('catBlock');
        if (el) el.innerHTML = '<div class="empty-state"><h3>\u26A0 \u811A\u672C\u9519\u8BEF</h3><p>' + err.message + '</p></div>';
        console.error(err);
    }
}

// ── Startup: try remote data.json first (GitHub Pages), fall back to local ──
(async function boot() {
    try {
        var resp = await fetch('data.json?_=' + Date.now());
        if (resp.ok) {
            var remote = await resp.json();
            if (remote && remote.items && remote.items.length > 0) {
                // Save to localStorage so initData() picks it up
                localStorage.setItem(LK, JSON.stringify(remote));
                console.log('✅ 远程 data.json 已加载 (' + remote.items.length + ' SKU)');
            }
        }
    } catch(e) {
        console.log('📦 远程加载失败，使用本地数据');
    }
    initData();
})();
</script>
